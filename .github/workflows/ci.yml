name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyxis
          POSTGRES_PASSWORD: pyxis
          POSTGRES_DB: pyxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyxis -d pyxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://pyxis:pyxis@localhost:5432/pyxis
      DATABASE_URL: postgres://pyxis_app:pyxis_app@localhost:5432/pyxis
      APP_DB_ROLE: pyxis_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - run: npm run test:tooling
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyxis
          POSTGRES_PASSWORD: pyxis
          POSTGRES_DB: pyxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyxis -d pyxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://pyxis:pyxis@localhost:5432/pyxis
      DATABASE_URL: postgres://pyxis_app:pyxis_app@localhost:5432/pyxis
      APP_DB_ROLE: pyxis_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the application role
        run: psql "$MIGRATION_DATABASE_URL" --command "CREATE ROLE pyxis_app LOGIN PASSWORD 'pyxis_app'"
      - run: npm run test:e2e

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run openapi:export
      - name: Fail when openapi/openapi.json is out of date
        run: git diff --exit-code openapi/openapi.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyxis
          POSTGRES_PASSWORD: pyxis
          POSTGRES_DB: pyxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyxis -d pyxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://pyxis:pyxis@localhost:5432/pyxis
      DATABASE_URL: postgres://pyxis_app:pyxis_app@localhost:5432/pyxis
      APP_DB_ROLE: pyxis_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --tag pyxis-api:ci .
      - name: Create the application role
        run: psql "$MIGRATION_DATABASE_URL" --command "CREATE ROLE pyxis_app LOGIN PASSWORD 'pyxis_app'"
      - name: Migrate with the production image
        run: >-
          docker run --rm --network host
          --env MIGRATION_DATABASE_URL --env APP_DB_ROLE
          pyxis-api:ci node dist/migrate.js
      - name: Start the API as the application role
        run: >-
          docker run --detach --name pyxis-api --network host
          --env DATABASE_URL --env PORT=3040
          pyxis-api:ci
      - name: Answer /health and connect as the application role
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3040/health; then
              docker logs pyxis-api 2>&1 | grep --quiet database.role_ok && exit 0
            fi
            sleep 1
          done
          docker logs pyxis-api
          exit 1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
