name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyxis
          POSTGRES_PASSWORD: pyxis
          POSTGRES_DB: pyxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyxis -d pyxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://pyxis:pyxis@localhost:5432/pyxis
      DATABASE_URL: postgres://pyxis_app:pyxis_app@localhost:5432/pyxis
      APP_DB_ROLE: pyxis_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - run: npm run test:tooling
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyxis
          POSTGRES_PASSWORD: pyxis
          POSTGRES_DB: pyxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyxis -d pyxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://pyxis:pyxis@localhost:5432/pyxis
      DATABASE_URL: postgres://pyxis_app:pyxis_app@localhost:5432/pyxis
      APP_DB_ROLE: pyxis_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the application role
        run: psql "$MIGRATION_DATABASE_URL" --command "CREATE ROLE pyxis_app LOGIN PASSWORD 'pyxis_app'"
      - run: npm run test:e2e

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run openapi:export
      - name: Fail when openapi/openapi.json is out of date
        run: git diff --exit-code openapi/openapi.json
      - name: Build the API reference from it
        run: npm run docs:build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyxis
          POSTGRES_PASSWORD: pyxis
          POSTGRES_DB: pyxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyxis -d pyxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://pyxis:pyxis@localhost:5432/pyxis
      DATABASE_URL: postgres://pyxis_app:pyxis_app@localhost:5432/pyxis
      APP_DB_ROLE: pyxis_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --tag pyxis-api:ci .
      - name: Create the application role
        run: psql "$MIGRATION_DATABASE_URL" --command "CREATE ROLE pyxis_app LOGIN PASSWORD 'pyxis_app'"
      - name: Migrate with the production image
        run: >-
          docker run --rm --network host
          --env MIGRATION_DATABASE_URL --env APP_DB_ROLE
          pyxis-api:ci node dist/migrate.js
      - name: Start the API as the application role
        run: >-
          docker run --detach --name pyxis-api --network host
          --env DATABASE_URL --env PORT=3040 --env RESEND_API_KEY=ci-placeholder
          --env DASHBOARD_ORIGIN=https://dashboard.example.com
          pyxis-api:ci
      - name: Answer /health and connect as the application role
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3040/health; then
              docker logs pyxis-api 2>&1 | grep --quiet database.role_ok && exit 0
            fi
            sleep 1
          done
          docker logs pyxis-api
          exit 1

  lambda-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyxis
          POSTGRES_PASSWORD: pyxis
          POSTGRES_DB: pyxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyxis -d pyxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INVOKE_PATH: 2015-03-31/functions/function/invocations
      EDGE_SHARED_SECRET: ci-edge-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --file Dockerfile.lambda --tag pyxis-api-lambda:ci .
      - name: Create the application role
        run: psql postgres://pyxis:pyxis@localhost:5432/pyxis --command "CREATE ROLE pyxis_app LOGIN PASSWORD 'pyxis_app'"
      - name: Migrate through the migration handler
        env:
          MIGRATION_DATABASE_URL: postgres://pyxis:pyxis@host.docker.internal:5432/pyxis
          APP_DB_ROLE: pyxis_app
        run: |
          docker run --detach --publish 9001:8080 --add-host host.docker.internal:host-gateway --env MIGRATION_DATABASE_URL --env APP_DB_ROLE pyxis-api-lambda:ci dist/lambda/migrate-entry.handler
          sleep 2
          curl --fail --silent --show-error -X POST "http://localhost:9001/$INVOKE_PATH" -d '{}' | tee migrate.json
          grep --quiet '"ok":true' migrate.json
      - name: Run the retention through the jobs handler
        env:
          DATABASE_URL: postgres://pyxis_app:pyxis_app@host.docker.internal:5432/pyxis
        run: |
          docker run --detach --publish 9002:8080 --add-host host.docker.internal:host-gateway --env DATABASE_URL pyxis-api-lambda:ci dist/lambda/jobs-entry.handler
          sleep 2
          curl --fail --silent --show-error -X POST "http://localhost:9002/$INVOKE_PATH" -d '{}' | tee jobs.json
          grep --quiet '"ok":true' jobs.json
      - name: Serve /health only to requests that carry the edge secret
        env:
          DATABASE_URL: postgres://pyxis_app:pyxis_app@host.docker.internal:5432/pyxis
        run: |
          docker run --detach --publish 9000:8080 --add-host host.docker.internal:host-gateway --env DATABASE_URL --env EDGE_SHARED_SECRET --env RESEND_API_KEY=ci-placeholder --env DASHBOARD_ORIGIN=https://dashboard.example.com pyxis-api-lambda:ci
          sleep 2
          jq --arg secret "$EDGE_SHARED_SECRET" '.headers["x-origin-verify"] = $secret' test/lambda/function-url-health.json > allowed-event.json
          curl --fail --silent --show-error -X POST "http://localhost:9000/$INVOKE_PATH" -d @allowed-event.json | tee allowed.json
          curl --fail --silent --show-error -X POST "http://localhost:9000/$INVOKE_PATH" -d @test/lambda/function-url-health.json | tee refused.json
          grep --quiet '"statusCode":200' allowed.json
          grep --quiet '"statusCode":403' refused.json

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
